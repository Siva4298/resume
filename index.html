                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>
                View LinkedIn Profile
              </a>
            </div>
          </div>
        </section>

        <footer>
          <p>© ${CONFIG.copyright} ${CONFIG.name} ${CONFIG.lastName} · ${CONFIG.title} · Member, <a href="#">${CONFIG.associations[0].shortname}</a> · Club President, <a href="#">${CONFIG.associations[1].shortname}</a></p>
        </footer>
      `;
    }

    // ── COMPETENCY FILTER ──
    window.activeFilters = new Set();

    window.toggleChip = function(slug) {
      if (window.activeFilters.has(slug)) {
        window.activeFilters.delete(slug);
      } else {
        window.activeFilters.add(slug);
      }
      document.querySelectorAll('.filter-chip').forEach(el => {
        el.classList.toggle('selected', window.activeFilters.has(el.dataset.slug));
      });
      applyFilters();
    };

    window.clearFilters = function() {
      window.activeFilters.clear();
      document.querySelectorAll('.filter-chip.selected').forEach(el => el.classList.remove('selected'));
      applyFilters();
    };

    window.applyFilters = function() {
      const filters = window.activeFilters;
      const items = document.querySelectorAll('[data-tags]');
      items.forEach(el => {
        const tags = (el.dataset.tags || '').split(',').filter(Boolean);
        const match = filters.size === 0 || tags.some(t => filters.has(t));
        el.style.display = match ? '' : 'none';
      });
      const notice = document.getElementById('filter-notice');
      const text = document.getElementById('filter-notice-text');
      if (!notice) return;
      if (filters.size === 0) {
        notice.style.display = 'none';
      } else {
        notice.style.display = '';
        const labels = Array.from(filters).map(slug => {
          const c = CONFIG.competencies.find(x => x.slug === slug);
          return c ? c.label : slug;
        });
        text.innerHTML = `<strong>Filtering by ${filters.size} competenc${filters.size === 1 ? 'y' : 'ies'}:</strong> ${labels.join(' · ')}`;
      }
    };

    // ── EDIT MODE & EXPORT ──
    const EDIT_STORAGE_KEY = 'siva-resume-edits-v1';

    function bootResume() {
      const saved = localStorage.getItem(EDIT_STORAGE_KEY);
      if (saved) {
        document.body.innerHTML = saved;
      } else {
        renderPage();
      }
      mountEditToolbar();
    }

    function mountEditToolbar() {
      if (document.getElementById('edit-toolbar')) return;
      const bar = document.createElement('div');
      bar.id = 'edit-toolbar';
      bar.innerHTML = `
        <button onclick="toggleEditMode()" id="edit-btn-toggle" title="Toggle edit mode">✏️ Edit</button>
        <button onclick="uploadPhoto()" title="Upload profile photo from file">📷 Upload</button>
        <button onclick="setPhotoFromUrl()" title="Paste an image URL">🔗 URL</button>
        <button onclick="removePhoto()" title="Remove photo, restore initials" style="background:var(--mid);">🗑 Photo</button>
        <button onclick="downloadResume()" title="Download standalone HTML">💾 Download</button>
        <button onclick="resetEdits()" title="Reset everything" style="background:var(--mid);">🔄 Reset</button>
      `;
      document.body.appendChild(bar);
      attachAvatarDropZone();
    }

    function attachAvatarDropZone() {
      const avatar = document.getElementById('hero-avatar') || document.querySelector('.hero-avatar');
      if (!avatar || avatar.dataset.dropAttached) return;
      avatar.dataset.dropAttached = 'true';
      ['dragenter','dragover'].forEach(evt => avatar.addEventListener(evt, e => {
        e.preventDefault(); e.stopPropagation();
        avatar.classList.add('drag-hover');
      }));
      ['dragleave','drop'].forEach(evt => avatar.addEventListener(evt, e => {
        e.preventDefault(); e.stopPropagation();
        avatar.classList.remove('drag-hover');
      }));
      avatar.addEventListener('drop', e => {
        const file = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
        if (file) handlePhotoFile({ target: { files: [file], value: '' } });
      });
    }

    window.toggleEditMode = function() {
      const isEdit = document.body.classList.toggle('edit-mode');
      const sel = 'h1, h2, h3, h4, p, li, span, .timeline-role, .timeline-company, .timeline-date, .degree, .institution, .period, .detail, .hero-title-badge, .stat-box .num, .stat-box .lbl, .project-tag, .pub-award, .badge';
      document.querySelectorAll(sel).forEach(el => {
        if (el.closest('#edit-toolbar')) return;
        el.contentEditable = isEdit ? 'true' : 'false';
      });
      const btn = document.getElementById('edit-btn-toggle');
      if (btn) btn.innerHTML = isEdit ? '🔒 Lock' : '✏️ Edit';
      if (isEdit) {
        snapshotEdits();
        if (!window._editListenerAttached) {
          document.addEventListener('input', () => {
            if (document.body.classList.contains('edit-mode')) snapshotEdits();
          });
          window._editListenerAttached = true;
        }
      }
    };

    function snapshotEdits() {
      const toolbar = document.getElementById('edit-toolbar');
      const placeholder = document.createComment('toolbar');
      if (toolbar) toolbar.replaceWith(placeholder);
      try {
        localStorage.setItem(EDIT_STORAGE_KEY, document.body.innerHTML);
      } catch (err) {
        console.warn('snapshotEdits failed — likely localStorage quota:', err);
        alert('Could not auto-save edits — your photo is probably too large for the browser quota (~5MB). Try a smaller image, or use the 🔗 URL button instead.');
      }
      if (toolbar) placeholder.replaceWith(toolbar);
      // Defensive: if the toolbar was somehow stripped, re-mount it.
      if (!document.getElementById('edit-toolbar')) mountEditToolbar();
    }

    // Prevent the browser from navigating to a dropped image if the user
    // misses the avatar. Without this, an off-target drop replaces the
    // whole page with the image and the toolbar disappears.
    ['dragover','drop'].forEach(evt => {
      window.addEventListener(evt, e => {
        if (e.target && e.target.closest && e.target.closest('.hero-avatar')) return;
        e.preventDefault();
      });
    });

    window.downloadResume = function() {
      snapshotEdits();
      const styleEl = document.querySelector('style');
      const styleHTML = styleEl ? styleEl.outerHTML : '';
      const clone = document.body.cloneNode(true);
      const tb = clone.querySelector('#edit-toolbar');
      if (tb) tb.remove();
      clone.querySelectorAll('[contenteditable]').forEach(el => el.removeAttribute('contenteditable'));
      const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${document.title}</title>
${styleHTML}
<script>
${getFilterScript()}
<\/script>
</head>
<body>${clone.innerHTML}</body>
</html>`;
      const blob = new Blob([html], { type: 'text/html' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `${CONFIG.name}-${CONFIG.lastName}-Resume.html`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    };

    function getFilterScript() {
      return `
        window.activeFilters = new Set();
        const COMPETENCIES = ${JSON.stringify(CONFIG.competencies)};
        window.toggleChip = function(slug) {
          if (window.activeFilters.has(slug)) window.activeFilters.delete(slug);
          else window.activeFilters.add(slug);
          document.querySelectorAll('.filter-chip').forEach(el => {
            el.classList.toggle('selected', window.activeFilters.has(el.dataset.slug));
          });
          applyFilters();
        };
        window.clearFilters = function() {
          window.activeFilters.clear();
          document.querySelectorAll('.filter-chip.selected').forEach(el => el.classList.remove('selected'));
          applyFilters();
        };
        window.applyFilters = function() {
          const f = window.activeFilters;
          document.querySelectorAll('[data-tags]').forEach(el => {
            const tags = (el.dataset.tags || '').split(',').filter(Boolean);
            el.style.display = (f.size === 0 || tags.some(t => f.has(t))) ? '' : 'none';
          });
          const notice = document.getElementById('filter-notice');
          const text = document.getElementById('filter-notice-text');
          if (!notice) return;
          if (f.size === 0) { notice.style.display = 'none'; return; }
          notice.style.display = '';
          const labels = Array.from(f).map(slug => {
            const c = COMPETENCIES.find(x => x.slug === slug);
            return c ? c.label : slug;
          });
          text.innerHTML = '<strong>Filtering by ' + f.size + ' competenc' + (f.size===1?'y':'ies') + ':</strong> ' + labels.join(' · ');
        };
      `;
    }

    window.resetEdits = function() {
      if (!confirm('Discard all your edits and restore the original from CONFIG?')) return;
      localStorage.removeItem(EDIT_STORAGE_KEY);
      location.reload();
    };

    window.uploadPhoto = function() {
      // Create the file input fresh each call so we never rely on stale DOM state.
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.style.display = 'none';
      input.addEventListener('change', function(event) {
        handlePhotoFile(event);
        if (input.parentNode) input.parentNode.removeChild(input);
      });
      document.body.appendChild(input);
      input.click();
    };

    window.handleAvatarClick = function() {
      if (document.body.classList.contains('edit-mode')) uploadPhoto();
    };

    window.setPhotoFromUrl = function() {
      const url = prompt('Paste an image URL (https://… or data:image/…):');
      if (!url) return;
      const trimmed = url.trim();
      if (!/^(https?:|data:image\/|\.?\/|file:)/i.test(trimmed)) {
        alert('That does not look like a valid image URL or path.');
        return;
      }
      applyPhoto(trimmed);
    };

    window.removePhoto = function() {
      const avatar = document.getElementById('hero-avatar') || document.querySelector('.hero-avatar');
      if (!avatar) return;
      avatar.innerHTML = CONFIG.initials;
      snapshotEdits();
    };

    function applyPhoto(src) {
      let avatar = document.getElementById('hero-avatar') || document.querySelector('.hero-avatar');
      if (!avatar) {
        alert('Could not find the avatar. Click 🔄 Reset and try again.');
        return;
      }
      avatar.innerHTML = `<img src="${src}" alt="Profile photo" style="width:100%;height:100%;object-fit:cover;border-radius:50%;display:block;">`;
      snapshotEdits();
    }

    window.handlePhotoFile = function(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      if (file.size > 3 * 1024 * 1024) {
        if (!confirm('That image is larger than 3MB. Big images bloat localStorage and the downloaded file. Use anyway?')) {
          event.target.value = '';
          return;
        }
      }
      const reader = new FileReader();
      reader.onload = function(e) { applyPhoto(e.target.result); };
      reader.onerror = function() { alert('Could not read that image file.'); };
      reader.readAsDataURL(file);
      if (event.target) event.target.value = '';
    };

    window.addEventListener('DOMContentLoaded', bootResume);
  </script>
  <style>
